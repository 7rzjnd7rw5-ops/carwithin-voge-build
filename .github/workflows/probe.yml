name: probe

on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "ubuntu ok"
          uname -a

  mac:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - run: |
          sw_vers
          xcodebuild -version
