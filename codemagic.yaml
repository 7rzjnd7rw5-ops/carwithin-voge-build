# Codemagic 配置：云端编 CarWithin + VOGE 的未签名 IPA
# 用法：codemagic.io → 应用 → 选 voge-unsigned-ipa → Start new build
# 产物：CarWithin-VOGE-unsigned.ipa（未签名，且已注入 MFi 身份）

workflows:
  voge-unsigned-ipa:
    name: CarWithin + VOGE 未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        UPSTREAM_REF: cffbf58513558f5ad3976c7497a57d0f3eab1494
        PATCH_URL: https://aka.doubaocdn.com/s/VRcEVTP19K
        PATCH_SHA256: 075feeba087de85fe02e00f96664b1543d0babd412ec0f5cd836acc65445b3b2
        MFI_SOURCE_IPA: https://github.com/xmz28/CarWithin/releases/download/v1.0.6/CarWithin-1.0.6-unsigned.ipa

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: 记录工具链版本
        script: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: 准备补丁
        script: |
          set -e
          # 优先用 CDN 上的最新补丁（仓库内补丁可能是旧版）
          rm -f /tmp/voge-port.patch
          if curl -fsSL "$PATCH_URL" -o /tmp/voge-port.patch \
             && echo "$PATCH_SHA256  /tmp/voge-port.patch" | shasum -a 256 -c -; then
            echo "使用 CDN 补丁（sha256 校验通过）"
          fi
          if [ ! -f /tmp/voge-port.patch ]; then
            if [ -f voge-port.patch ]; then
              echo "CDN 不可用或校验失败，回退到仓库内补丁"
              cp voge-port.patch /tmp/voge-port.patch
            else
              echo "既没有可用的 CDN 补丁，也没有仓库内补丁"
              exit 1
            fi
          fi

      - name: 拉上游并打补丁
        script: |
          set -e
          git clone https://github.com/xmz28/CarWithin.git upstream
          cd upstream
          git checkout "$UPSTREAM_REF"
          git log -1 --oneline
          git apply --verbose /tmp/voge-port.patch

      - name: 编译（关闭代码签名）
        script: |
          set -e
          cd upstream
          xcodebuild \
            -project TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: 打包未签名 IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          APP="$CM_BUILD_DIR/dd/Build/Products/Release-iphoneos/TDSCarKit.app"
          if [ ! -d "$APP" ]; then
            echo "找不到产物：$APP"
            ls -R "$CM_BUILD_DIR/dd/Build/Products" || true
            exit 1
          fi
          rm -rf Payload CarWithin-VOGE-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CarWithin-VOGE-unsigned.ipa Payload
          ls -lh CarWithin-VOGE-unsigned.ipa

      - name: 注入 MFi 身份资源
        script: |
          set -e
          # 开源仓库不含 MFi 身份（授权原因），从上游公开未签名包取出三件套补进来。
          cd "$CM_BUILD_DIR"
          curl -fsSL -o /tmp/mfi-source.ipa "$MFI_SOURCE_IPA"
          rm -rf /tmp/mfi-src && mkdir -p /tmp/mfi-src
          unzip -qq /tmp/mfi-source.ipa -d /tmp/mfi-src
          SRC_APP="/tmp/mfi-src/Payload/TDSCarKit.app"
          for f in certificate.p7b leaf.cer private.x963; do
            if [ ! -f "$SRC_APP/$f" ]; then
              echo "上游包里没有 $f，MFi 注入失败"
              exit 1
            fi
            cp "$SRC_APP/$f" Payload/TDSCarKit.app/
            echo "已注入 $f"
          done
          rm -f CarWithin-VOGE-unsigned.ipa
          zip -qry CarWithin-VOGE-unsigned.ipa Payload
          echo "--- 产物校验 ---"
          unzip -l CarWithin-VOGE-unsigned.ipa | grep -E "certificate.p7b|leaf.cer|private.x963"
          ls -lh CarWithin-VOGE-unsigned.ipa

    artifacts:
      - CarWithin-VOGE-unsigned.ipa
