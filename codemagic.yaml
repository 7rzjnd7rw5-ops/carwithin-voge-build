# Codemagic 配置：云端编 CarWithin + VOGE 的未签名 IPA
# 用法：codemagic.io 用 GitHub 登录 → Add application → 选本仓库 → 选 voge-unsigned-ipa → Start new build
# 产物：CarWithin-VOGE-unsigned.ipa（未签名，丢全能签即可）

workflows:
  voge-unsigned-ipa:
    name: CarWithin + VOGE 未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        UPSTREAM_REF: cffbf58513558f5ad3976c7497a57d0f3eab1494
        PATCH_URL: https://aka.doubaocdn.com/s/hmEPxW0odD
        PATCH_SHA256: b5b22493b93494bf3bd2726ad3e8d7a963f58c2593388f71d04fea6c103d43fd

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: 记录工具链版本
        script: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: 准备补丁
        script: |
          set -e
          if [ -f voge-port.patch ]; then
            echo "使用仓库内补丁"
            cp voge-port.patch /tmp/voge-port.patch
          else
            echo "仓库内无补丁，从 $PATCH_URL 下载"
            curl -fsSL "$PATCH_URL" -o /tmp/voge-port.patch
          fi
          echo "$PATCH_SHA256  /tmp/voge-port.patch" | shasum -a 256 -c -

      - name: 拉上游并打补丁
        script: |
          set -e
          git clone https://github.com/xmz28/CarWithin.git upstream
          cd upstream
          git checkout "$UPSTREAM_REF"
          git log -1 --oneline
          git apply --verbose /tmp/voge-port.patch

      - name: 编译（关闭代码签名）
        script: |
          set -e
          cd upstream
          xcodebuild \
            -project TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: 打包未签名 IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          APP="$CM_BUILD_DIR/dd/Build/Products/Release-iphoneos/TDSCarKit.app"
          if [ ! -d "$APP" ]; then
            echo "找不到产物：$APP"
            ls -R "$CM_BUILD_DIR/dd/Build/Products" || true
            exit 1
          fi
          rm -rf Payload CarWithin-VOGE-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CarWithin-VOGE-unsigned.ipa Payload
          ls -lh CarWithin-VOGE-unsigned.ipa

    artifacts:
      - CarWithin-VOGE-unsigned.ipa
